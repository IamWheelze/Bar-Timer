version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: deadline-db
    environment:
      POSTGRES_DB: deadline_system
      POSTGRES_USER: deadline_user
      POSTGRES_PASSWORD: deadline_password_change_in_production
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deadline_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deadline-backend
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://deadline_user:deadline_password_change_in_production@postgres:5432/deadline_system
      JWT_SECRET: your-secret-jwt-key-change-this-in-production-min-32-chars
      FRONTEND_URL: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: deadline-frontend
    environment:
      REACT_APP_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm start

volumes:
  postgres_data:
